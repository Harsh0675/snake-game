<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="Snake Arcade — a responsive vanilla JavaScript snake game." />
  <title>Snake Arcade</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">ARCADE // CLASSIC</p><h1>SNAKE<span>+</span></h1></div>
      <button id="pauseButton" class="iconButton" aria-label="Pause game">Ⅱ</button>
    </header>

    <section class="stats" aria-live="polite">
      <div><span>FOOD</span><strong id="pointsEarned">0</strong></div>
      <div><span>BEST</span><strong id="bestScore">0</strong></div>
      <div><span>SPEED</span><strong id="speedLevel">1</strong></div>
    </section>

    <section id="gameContainer" aria-label="Snake game board"></section>

    <div class="statusLine"><span id="gameStatus">READY</span><span id="blocksTravelled">0 BLOCKS</span></div>

    <div id="onScreenControllers" aria-label="Game controls">
      <button id="leftButton" aria-label="Move left">←</button>
      <div><button id="upButton" aria-label="Move up">↑</button><button id="downButton" aria-label="Move down">↓</button></div>
      <button id="rightButton" aria-label="Move right">→</button>
    </div>

    <section id="startPanel" class="panel">
      <p class="eyebrow">READY PLAYER</p>
      <h2>Grow. Survive.<br><em>Beat your best.</em></h2>
      <p>Use the arrow keys, WASD, or the touch controls. The snake wraps around the edges.</p>
      <button id="startButton" class="primary">START GAME <span>▶</span></button>
    </section>

    <section id="gameOverPanel" class="panel hidden">
      <p class="eyebrow">RUN COMPLETE</p>
      <h2>GAME<br><em>OVER</em></h2>
      <div class="result"><span>SCORE</span><strong id="finalScore">0</strong></div>
      <div class="result"><span>BEST</span><strong id="finalBest">0</strong></div>
      <button id="restartButton" class="primary">PLAY AGAIN <span>↻</span></button>
    </section>

    <footer>Built with HTML, CSS &amp; Vanilla JavaScript · <a href="https://github.com/Harsh0675/snake-game" target="_blank" rel="noreferrer">Source</a></footer>
  </main>
  <script src="jscript.js"></script>
</body>
</html>
